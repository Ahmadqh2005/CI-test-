version: 2.1

jobs:
  # 1. Continuous Integration: Test & Lint
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Upgrade pip and install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run linter
          command: flake8 .
      - run:
          name: Run tests
          command: pytest --cov=calculator

  # 2. Continuous Delivery: Build & Push Docker Image
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build Docker image
          command: docker build -t $DOCKERHUB_USERNAME/ci-test:latest .
      - run:
          name: Push image to Docker Hub
          command: docker push $DOCKERHUB_USERNAME/ci-test:latest
      - run:
          name: Trigger Render Deployment
          command: curl -X POST "$RENDER_DEPLOY_HOOK"

workflows:
  ci-cd-pipeline:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
          filters:
            branches:
              only: main