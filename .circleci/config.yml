version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Upgrade pip and install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run linter
          command: flake8 .
      - run:
          name: Run tests
          command: pytest --cov=calculator

workflows:
  test-workflow:
    jobs:
      - build-and-test